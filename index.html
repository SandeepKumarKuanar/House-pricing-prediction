<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <main>
        <section title="content">
            <h1>Predict House Price</h1>
            <form id="prediction-form">
                <label for="sqft_living">Square Foot Living:</label><br>
                <input type="number" id="sqft_living" value="1340" required><br><br>

                <label for="bedrooms">Bedrooms:</label><br>
                <input type="number" id="bedrooms" value="3" required><br><br>

                <label for="bathrooms">Bathrooms:</label><br>
                <input type="number" step="0.1" id="bathrooms" value="1.5" required><br><br>
                
                <button type="submit" id="predict-button">
                    <span class="button-text">Predict Price</span>
                    <span class="button-loader"></span>
                </button>
            </form>
        </section>
        <h2 class="predicted">Predicted Price: <span id="result">-</span></h2>
    </main>
    <script src="scripts/main.js"></script>
</body>
</html>
